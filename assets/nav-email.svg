<svg xmlns="http://www.w3.org/2000/svg" width="105" height="94" viewBox="642 0 105 94" role="img" aria-label="Email jonathanrashi100@gmail.com"><title>Email jonathanrashi100@gmail.com</title><style>.f,.pulse{opacity:0}@media (prefers-reduced-motion:no-preference){.f{animation:flick 70ms step-end 1}.in{animation:land 1ms step-end backwards}.pulse{stroke-dasharray:9 1000;animation:pulse 3000ms linear 3}.stroke{stroke-dasharray:1.01 1.01;animation:sign var(--d) linear var(--t) backwards,land 1ms step-end var(--t) backwards}.token{animation:token 9000ms ease-out var(--t) 1}.nod{animation:nod 750ms step-end var(--t) 8}.note{animation:note 2250ms step-end var(--t) 3}.caret{animation:caret 1000ms step-end var(--t) 6}.tone{animation:tone 9000ms step-end var(--t) 1}}@keyframes flick{0%,100%{opacity:1}}@keyframes land{from{opacity:0}to{opacity:1}}@keyframes pulse{0%{opacity:1;stroke-dashoffset:9}15%{opacity:1;stroke-dashoffset:-100}15.1%,100%{opacity:0}}@keyframes sign{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes token{0%,30%{transform:none}33%,63%{transform:translateX(34px)}66%,96%{transform:translateX(82px)}}@keyframes nod{0%,100%{transform:translateY(1px)}50%{transform:none}}@keyframes note{0%{opacity:1;transform:none}33%{opacity:1;transform:translateY(-1px)}66%{opacity:1;transform:translateY(-2px)}100%{opacity:0}}@keyframes caret{0%{opacity:1}50%{opacity:0}}@keyframes tone{0%{fill:var(--a)}25%{fill:var(--b)}50%{fill:var(--c)}75%{fill:var(--d)}}.note{opacity:0}</style><defs><linearGradient id="lit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".03"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><path id="t0" d="M0.9 0L0.9 -7.1L5.22 -7.1L5.22 -6.26L1.76 -6.26L1.76 -3.97L5.1 -3.97L5.1 -3.15L1.76 -3.15L1.76 -0.84L5.3 -0.84L5.3 0Z"/><path id="t1" d="M2.62 -0.8L1.28 -6.3L1.36 -6.3L1.36 0L0.5 0L0.5 -7.1L1.8 -7.1L3.2 -1.26L2.8 -1.26L4.2 -7.1L5.5 -7.1L5.5 0L4.64 0L4.64 -6.3L4.72 -6.3L3.38 -0.8Z"/><path id="t2" d
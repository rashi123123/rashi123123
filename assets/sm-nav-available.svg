<svg xmlns="http://www.w3.org/2000/svg" width="43.75" height="70" viewBox="223.75 0 43.75 70" role="img" aria-label="Available. Looking to join a startup as a product designer."><title>Available. Looking to join a startup as a product designer.</title><style>.f,.pulse{opacity:0}@media (prefers-reduced-motion:no-preference){.f{animation:flick 70ms step-end 1}.in{animation:land 1ms step-end backwards}.pulse{stroke-dasharray:9 1000;animation:pulse 3000ms linear 3}.stroke{stroke-dasharray:1.01 1.01;animation:sign var(--d) linear var(--t) backwards,land 1ms step-end var(--t) backwards}.token{animation:token 9000ms ease-out var(--t) 1}.nod{animation:nod 750ms step-end var(--t) 8}.note{animation:note 2250ms step-end var(--t) 3}.caret{animation:caret 1000ms step-end var(--t) 6}.tone{animation:tone 9000ms step-end var(--t) 1}}@keyframes flick{0%,100%{opacity:1}}@keyframes land{from{opacity:0}to{opacity:1}}@keyframes pulse{0%{opacity:1;stroke-dashoffset:9}15%{opacity:1;stroke-dashoffset:-100}15.1%,100%{opacity:0}}@keyframes sign{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes token{0%,30%{transform:none}33%,63%{transform:translateX(34px)}66%,96%{transform:translateX(82px)}}@keyframes nod{0%,100%{transform:translateY(1px)}50%{transform:none}}@keyframes note{0%{opacity:1;transform:none}33%{opacity:1;transform:translateY(-1px)}66%{opacity:1;transform:translateY(-2px)}100%{opacity:0}}@keyframes caret{0%{opacity:1}50%{opacity:0}}@keyframes tone{0%{fill:var(--a)}25%{fill:var(--b)}50%{fill:var(--c)}75%{fill:var(--d)}}.note{opacity:0}</style><defs><linearGradient id="lit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".03"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><rect x="223.75" y="0" width="43.75" height="70" fill="#262626"/><rect x="223.75" y="6" width="43.75" height="58" fill="#0a0a0a"/><path d="M238.5 6V64M267.5 6V64M223.75 6.5H267.5M223.75 35.5H267.5M223.75 64.5H267.5" stroke="rgba(255,255,255,.045)"